[package]
# Not `core`, which would shadow Rust's own `core` crate.
name = "last-exit-core"
description = "The simulation core, built to one WASM binary for the Node server and the browser (docs/27)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is the WASM module; rlib lets `cargo test` run natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Rapier, compiled into the core rather than loaded through rapier.js (docs/27 "Physics", #1192).
# Default features (2D, f32, std, the block solver) plus `enhanced-determinism`, which routes
# simba's and parry's math through the `libm` crate; `parallel`, `simd*` and the debug features
# stay off. tools/core-wasm-audit.mjs checks the built module for what determinism forbids.
rapier2d = { version = "0.36.1", features = ["enhanced-determinism"] }
