# Forgejo Actions CI (#547). The gate set and what stays manual are in docs/31.
# Runners carry the `docker` label; jobs run in a clean container, never on the runner's host.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: docker
    container:
      # Matches .nvmrc; bump both together.
      image: node:24.15.0-bookworm
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      # package.json pins npm 12, which the Node image does not bundle.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm --prefix map/macro ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mapgen
